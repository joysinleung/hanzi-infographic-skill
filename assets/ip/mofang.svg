<?xml version="1.0" encoding="UTF-8"?>
<!--
  墨方（Mofang）IP 资产 · hanzi-infographic-skill
  自创视觉符号（非小黑）：圆角方块身 + 单只方块眼（方块内嵌小方块，非圆点）+ 网格纹理皮肤。
  气质：冷静的"数据守护者"，可承担动作，非装饰。
  本文件为设计资产与预览；模板内用 inline <symbol> 复用（见 daily-review-panorama.html）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" font-family="Helvetica, Arial, sans-serif">
  <rect width="520" height="140" fill="#fafaf8"/>
  <text x="16" y="26" font-size="14" fill="#737373" font-weight="600">墨方 Mofang · 自创视觉 IP（动作原子）</text>

  <!-- 基础形 -->
  <g transform="translate(40,50)">
    <rect x="0" y="0" width="40" height="40" rx="11" fill="#2d2926"/>
    <path d="M0 13h40 M0 27h40 M13 0v40 M27 0v40" stroke="#524c46" stroke-width="1" opacity=".5"/>
    <rect x="11" y="11" width="18" height="18" rx="2" fill="#fff"/>
    <rect x="17" y="17" width="6" height="6" fill="#2d2926"/>
  </g>
  <text x="40" y="108" font-size="11" fill="#737373">基础形</text>

  <!-- carry 搬运 -->
  <g transform="translate(140,50)">
    <rect x="0" y="6" width="34" height="34" rx="9" fill="#2d2926"/>
    <path d="M0 17h34 M0 28h34 M11 6v34 M22 6v34" stroke="#524c46" stroke-width="1" opacity=".5"/>
    <rect x="9" y="11" width="16" height="16" rx="2" fill="#fff"/>
    <rect x="13" y="15" width="5" height="5" fill="#2d2926"/>
    <line x1="30" y1="20" x2="44" y2="14" stroke="#2d2926" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="42" y="6" width="12" height="14" rx="2" fill="#ff6a13"/>
  </g>
  <text x="140" y="108" font-size="11" fill="#737373">carry 搬运</text>

  <!-- warn 警示 -->
  <g transform="translate(250,50)">
    <rect x="0" y="6" width="34" height="34" rx="9" fill="#2d2926"/>
    <path d="M0 17h34 M0 28h34 M11 6v34 M22 6v34" stroke="#524c46" stroke-width="1" opacity=".5"/>
    <rect x="9" y="11" width="16" height="16" rx="2" fill="#fff"/>
    <rect x="13" y="15" width="5" height="5" fill="#2d2926"/>
    <line x1="28" y1="20" x2="40" y2="2" stroke="#2d2926" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="35" y="-6" width="13" height="10" rx="2" fill="#e53935"/>
    <text x="41.5" y="2.5" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">!</text>
  </g>
  <text x="250" y="108" font-size="11" fill="#737373">warn 警示</text>

  <!-- gate 守门 -->
  <g transform="translate(360,50)">
    <rect x="6" y="2" width="28" height="40" rx="6" fill="none" stroke="#2d2926" stroke-width="3"/>
    <rect x="14" y="14" width="30" height="30" rx="9" fill="#2d2926"/>
    <path d="M14 24h30 M14 34h30 M24 14v30 M34 14v30" stroke="#524c46" stroke-width="1" opacity=".5"/>
    <rect x="23" y="19" width="14" height="14" rx="2" fill="#fff"/>
    <rect x="27" y="23" width="5" height="5" fill="#2d2926"/>
  </g>
  <text x="360" y="108" font-size="11" fill="#737373">gate 守门</text>

  <!-- log 记录 -->
  <g transform="translate(450,50)">
    <rect x="0" y="6" width="34" height="34" rx="9" fill="#2d2926"/>
    <path d="M0 17h34 M0 28h34 M11 6v34 M22 6v34" stroke="#524c46" stroke-width="1" opacity=".5"/>
    <rect x="9" y="11" width="16" height="16" rx="2" fill="#fff"/>
    <rect x="13" y="15" width="5" height="5" fill="#2d2926"/>
    <rect x="30" y="4" width="14" height="18" rx="2" fill="#fff" stroke="#2d2926" stroke-width="1.5"/>
    <path d="M33 10h8 M33 15h8 M33 20h5" stroke="#2d2926" stroke-width="1"/>
  </g>
  <text x="450" y="108" font-size="11" fill="#737373">log 记录</text>
</svg>
